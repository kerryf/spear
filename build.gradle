plugins {
    id 'java'
    id 'groovy'
    id 'application'
}

group = 'ca.kerryf'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:7.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'
    implementation 'org.xerial:sqlite-jdbc:3.51.3.0'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'org.apache.groovy:groovy-all:5.0.4'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
}

application {
    mainClass = 'spear.Spear'
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'spear.jar'
    manifest {
        attributes(
            'Main-Class': 'spear.Spear',
            'Class-Path': configurations.runtimeClasspath.files.collect { 'dependency-jars/' + it.name }.join(' ')
        )
    }
}

tasks.register('copyDependencies', Copy) {
    description = 'Copy dependencies to the dependency-jars directory.'
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependency-jars')
}

build.dependsOn copyDependencies
