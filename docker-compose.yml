services:
  javalin:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./conf:/opt/spear/conf
      - ./logs:/opt/spear/logs
      - ./data:/opt/spear/data
  nginx:
    image: docker.io/nginx:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - javalin
